name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Generate Pacman
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ComputerUni
          outputs: |
            dist/github-user-contribution.svg?palette=pacman
            dist/github-user-contribution-dark.svg?palette=pacman&color_snake=yellow

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
