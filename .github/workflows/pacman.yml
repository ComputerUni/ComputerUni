name: Generate 3D Calendar and Pacman

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ComputerUni
          outputs: |
            dist/pacman.svg?color_snake=yellow&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ComputerUni
          template: classic
          base: ""
          output_action: none
          filename: dist/calendar3d.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
